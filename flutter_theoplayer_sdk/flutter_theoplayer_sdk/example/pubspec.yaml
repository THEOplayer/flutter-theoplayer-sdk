name: theoplayer_example
description: An example project that demonstrates how to use the THEOplayer plugin.
publish_to: 'none'

environment:
  sdk: ^3.3.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  theoplayer:
    path: ../
  cupertino_icons: ^1.0.2

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - web/theoplayer/
