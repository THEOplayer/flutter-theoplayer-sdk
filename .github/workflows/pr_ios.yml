name: Build iOS on PRs
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_ios:
    # A healthy run takes ~20 min. Without this cap a hung job runs until GitHub's 6 h limit.
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        xcode_version: ['26.3']
        flutter_version: ['stable']

    runs-on: macos-26
    steps:
    - name: Checkout
      uses: actions/checkout@v4


    - name: Select Xcode ${{ matrix.xcode_version }}
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ matrix.xcode_version }} # Check versions: https://github.com/actions/runner-images/blob/main/images/macos/macos-14-Readme.md

    - name: Setup Flutter (${{ matrix.flutter_version }} channel)
      uses: subosito/flutter-action@v2
      with:
        channel: ${{ matrix.flutter_version }}
        #architecture: x64
        cache: true
        cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:' # optional, change this to force refresh cache
        cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:' # optional, change this to specify the cache path

    - name: Print flutter version
      run: flutter doctor

    - name: Setup Melos
      uses: bluefireteam/melos-action@v3

    - name: Pub get
      run: flutter pub get
      working-directory: flutter_theoplayer_sdk/flutter_theoplayer_sdk

    - name: Run unit tests
      run: flutter test
      working-directory: flutter_theoplayer_sdk/flutter_theoplayer_sdk

    - name: Start iOS simulator
      id: simulator
      uses: futureware-tech/simulator-action@v5
      with:
        model: 'iPhone 17'
        os_version: '>=18.5'
        # Starting tests before CoreSimulator is fully ready can leave `flutter test` hanging after the Xcode build.
        wait_for_boot: true

    - name: Run integration tests
      # `flutter test` sometimes never gets past app launch on the simulator and produces no output.
      timeout-minutes: 15
      run: |
        # Use the simulator selected and booted above instead of relying on Flutter's device discovery.
        flutter test integration_test_single_entrypoint/entrypoint.dart \
          -d '${{ steps.simulator.outputs.udid }}' \
          --verbose > "$RUNNER_TEMP/flutter-test.log" 2>&1
      working-directory: flutter_theoplayer_sdk/flutter_theoplayer_sdk/example
      env:
        TEST_LICENSE: ${{ secrets.TEST_LICENSE }}

    - name: Print verbose Flutter log tail
      if: always()
      run: |
        if [ -f "$RUNNER_TEMP/flutter-test.log" ]; then
          tail -n 300 "$RUNNER_TEMP/flutter-test.log"
        else
          echo "Flutter did not create a diagnostic log."
        fi

    - name: Upload full verbose Flutter log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: flutter-test-${{ matrix.flutter_version }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/flutter-test.log
        if-no-files-found: warn
        retention-days: 7

    - name: Dump simulator state on failure
      if: failure()
      run: |
        xcrun simctl list devices booted
        xcrun simctl listapps booted | grep -A3 theoplayerExample || echo "example app not installed on the simulator"
        xcrun simctl spawn booted log show --last 30m --style compact \
          --predicate 'process == "Runner" OR eventMessage CONTAINS "theoplayerExample" OR eventMessage CONTAINS[c] "Runner.app" OR ((process == "SpringBoard" OR process == "installd" OR process == "runningboardd") AND messageType == error)' \
          | tail -n 400


