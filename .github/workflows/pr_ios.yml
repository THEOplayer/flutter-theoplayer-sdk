name: Build iOS on PRs
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_ios:
    # A healthy run takes ~20 min. Without this cap a hung job runs until GitHub's 6 h limit.
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        xcode_version: ['26.3']
        flutter_version: ['stable', 'beta']

    runs-on: macos-26
    steps:
    - name: Checkout
      uses: actions/checkout@v4


    - name: Select Xcode ${{ matrix.xcode_version }}
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ matrix.xcode_version }} # Check versions: https://github.com/actions/runner-images/blob/main/images/macos/macos-14-Readme.md

    - name: Setup Flutter (${{ matrix.flutter_version }} channel)
      uses: subosito/flutter-action@v2
      with:
        channel: ${{ matrix.flutter_version }}
        #architecture: x64
        cache: true
        cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:' # optional, change this to force refresh cache
        cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:' # optional, change this to specify the cache path

    - name: Print flutter version
      run: flutter doctor

    - name: Setup Melos
      uses: bluefireteam/melos-action@v3

    - name: Pub get
      run: flutter pub get
      working-directory: flutter_theoplayer_sdk/flutter_theoplayer_sdk

    - name: Run unit tests
      run: flutter test
      working-directory: flutter_theoplayer_sdk/flutter_theoplayer_sdk

    - name: Start iOS simulator
      id: simulator
      uses: futureware-tech/simulator-action@v5
      with:
        model: 'iPhone 17'
        os_version: '>=18.5'

    - name: Run integration tests
      id: integration-tests
      # `flutter test` sometimes never gets past app launch on the simulator and produces no output.
      timeout-minutes: 25
      run: |
        simulator_udid='${{ steps.simulator.outputs.udid }}'
        max_attempts=2
        vm_service_timeout=90
        attempt=1

        while [ "$attempt" -le "$max_attempts" ]; do
          log="$RUNNER_TEMP/flutter-test-attempt-$attempt.log"
          watchdog_marker="$RUNNER_TEMP/vm-service-watchdog-$attempt"
          rm -f "$log" "$watchdog_marker"

          flutter test integration_test_single_entrypoint/entrypoint.dart \
            -d "$simulator_udid" \
            --verbose > "$log" 2>&1 &
          test_pid=$!

          (
            while kill -0 "$test_pid" 2>/dev/null; do
              if grep -Fq 'Waiting for VM Service port to be available...' "$log"; then
                elapsed=0
                while kill -0 "$test_pid" 2>/dev/null && [ "$elapsed" -lt "$vm_service_timeout" ]; do
                  if grep -Fq 'VM Service URL on device:' "$log"; then
                    exit 0
                  fi
                  sleep 2
                  elapsed=$((elapsed + 2))
                done

                if kill -0 "$test_pid" 2>/dev/null && ! grep -Fq 'VM Service URL on device:' "$log"; then
                  touch "$watchdog_marker"
                  echo "::warning title=Flutter VM Service watchdog::attempt $attempt did not discover the VM Service within ${vm_service_timeout}s"
                  kill -TERM "$test_pid" 2>/dev/null || true
                  sleep 10
                  kill -KILL "$test_pid" 2>/dev/null || true
                fi
                exit 0
              fi
              sleep 2
            done
          ) &
          watchdog_pid=$!

          set +e
          wait "$test_pid"
          status=$?
          set -e
          kill "$watchdog_pid" 2>/dev/null || true
          wait "$watchdog_pid" 2>/dev/null || true

          if [ "$status" -eq 0 ] && [ ! -f "$watchdog_marker" ]; then
            tail -n 50 "$log"
            exit 0
          fi

          tail -n 300 "$log"

          if [ -f "$watchdog_marker" ] && [ "$attempt" -lt "$max_attempts" ]; then
            echo "::warning title=Retrying iOS integration tests::resetting the simulator after a stalled VM Service connection"
            xcrun simctl shutdown "$simulator_udid" || true
            xcrun simctl bootstatus "$simulator_udid" -b
            attempt=$((attempt + 1))
            continue
          fi

          if [ "$status" -eq 0 ]; then
            status=1
          fi
          exit "$status"
        done
      working-directory: flutter_theoplayer_sdk/flutter_theoplayer_sdk/example
      env:
        TEST_LICENSE: ${{ secrets.TEST_LICENSE }}

    - name: Dump simulator state on failure
      if: failure()
      run: |
        xcrun simctl list devices booted
        xcrun simctl listapps '${{ steps.simulator.outputs.udid }}' | grep -A3 theoplayerExample || echo "example app not installed on the simulator"
        xcrun simctl spawn '${{ steps.simulator.outputs.udid }}' log show --last 30m --style compact \
          --predicate 'process == "Runner" OR eventMessage CONTAINS "theoplayerExample" OR eventMessage CONTAINS[c] "Runner.app" OR ((process == "SpringBoard" OR process == "installd" OR process == "runningboardd") AND messageType == error)' \
          | tail -n 400

    - name: Build iOS
      run: flutter build ios --release --no-codesign
      working-directory: flutter_theoplayer_sdk/flutter_theoplayer_sdk/example


